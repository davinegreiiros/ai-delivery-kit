name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: testes (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          # Versão mínima suportada (é o Python do macOS). Ubuntu 26.04 não tem build 3.9.
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validar estrutura do kit
        run: python scripts/validate_kit.py
      - name: Testes unitários
        run: python -m unittest discover -s tests -v

  install-unix:
    name: instalador bash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Instalar, reinstalar e desinstalar em HOME temporário
        run: |
          export HOME="$(mktemp -d)"
          ./install.sh --client all
          ./install.sh --client all
          test "$(ls "$HOME/.claude/skills" | wc -l)" -eq "$(ls skills | wc -l)"
          test -L "$HOME/.agents/skills/kit-sdd"
          test -L "$HOME/.gemini/config/skills/kit-sdd"
          mkdir "$HOME/proj"
          ./install.sh --project "$HOME/proj"
          test -f "$HOME/proj/.agents/skills/kit-sdd/SKILL.md"
          ./install.sh --project "$HOME/proj" --uninstall
          ./install.sh --uninstall
          test -z "$(ls "$HOME/.claude/skills")"
          test -z "$(ls "$HOME/.gemini/config/skills")"

  install-windows:
    name: instalador PowerShell (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - name: Instalar, reinstalar e desinstalar em perfil temporário
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          New-Item -ItemType Directory -Path $tmp | Out-Null
          $exe = if ('${{ matrix.shell }}' -eq 'pwsh') { 'pwsh' } else { 'powershell' }
          $env:USERPROFILE = $tmp
          & $exe -NoProfile -File .\install.ps1 -Client all
          if ($LASTEXITCODE) { throw 'install falhou' }
          & $exe -NoProfile -File .\install.ps1 -Client all
          if ($LASTEXITCODE) { throw 'reinstall falhou' }
          $expected = (Get-ChildItem -Directory skills).Count
          $got = (Get-ChildItem (Join-Path $tmp '.claude\skills')).Count
          if ($got -ne $expected) { throw "esperado $expected links, obtido $got" }
          if (-not (Test-Path (Join-Path $tmp '.agents\skills\kit-sdd\SKILL.md'))) { throw 'junction quebrada' }
          if (-not (Test-Path (Join-Path $tmp '.gemini\config\skills\kit-sdd\SKILL.md'))) { throw 'antigravity sem skills' }
          $proj = Join-Path $tmp 'proj'; New-Item -ItemType Directory -Path $proj | Out-Null
          & $exe -NoProfile -File .\install.ps1 -Project $proj
          if (-not (Test-Path (Join-Path $proj '.agents\skills\kit-sdd\SKILL.md'))) { throw 'cópia falhou' }
          & $exe -NoProfile -File .\install.ps1 -Uninstall
          if ((Get-ChildItem (Join-Path $tmp '.claude\skills')).Count -ne 0) { throw 'uninstall falhou' }
          if ((Get-ChildItem (Join-Path $tmp '.gemini\config\skills')).Count -ne 0) { throw 'uninstall deixou antigravity' }
          if (-not (Test-Path (Join-Path (Get-Location) 'skills\kit-sdd\SKILL.md'))) { throw 'uninstall apagou a origem' }

  # Roda os comandos exatamente como estão no README (modo remoto: clona em ~/.ai-delivery-kit).
  readme-unix:
    name: comandos do README (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Fonte local do kit (versão deste commit)
        run: |
          SRC="$RUNNER_TEMP/kit-src"
          git clone -q "$GITHUB_WORKSPACE" "$SRC"
          git -C "$SRC" checkout -q -B main
          echo "AI_KIT_SRC=$SRC" >> "$GITHUB_ENV"
      - name: curl | bash, atualizar, escolher cliente e remover
        run: |
          export HOME="$(mktemp -d)" AI_KIT_REPO="$AI_KIT_SRC"
          cd "$HOME"
          cat "$GITHUB_WORKSPACE/install.sh" | bash
          test "$(readlink "$HOME/.claude/skills/kit-sdd")" = "$HOME/.ai-delivery-kit/skills/kit-sdd"
          test -f "$HOME/.agents/skills/kit-sdd/SKILL.md"
          cat "$GITHUB_WORKSPACE/install.sh" | bash
          test -f "$HOME/.gemini/config/skills/kit-sdd/SKILL.md"
          cat "$GITHUB_WORKSPACE/install.sh" | bash -s -- --client claude
          cat "$GITHUB_WORKSPACE/install.sh" | bash -s -- --client agents
          cat "$GITHUB_WORKSPACE/install.sh" | bash -s -- --client antigravity
          "$HOME/.ai-delivery-kit/install.sh" --uninstall
          test -z "$(ls "$HOME/.claude/skills")"
          test -z "$(ls "$HOME/.agents/skills")"
          test -z "$(ls "$HOME/.gemini/config/skills")"
      - name: Comando real do README pela internet
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          export HOME="$(mktemp -d)"
          cd "$HOME"
          curl -fsSL https://raw.githubusercontent.com/davinegreiiros/ai-delivery-kit/main/install.sh | bash
          test -f "$HOME/.claude/skills/kit-sdd/SKILL.md"
          test -f "$HOME/.agents/skills/kit-sdd/SKILL.md"

  readme-windows:
    name: comandos do README (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - name: Fonte local do kit (versão deste commit)
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'kit-src'
          git clone -q $env:GITHUB_WORKSPACE $src
          git -C $src checkout -q -B main
          "AI_KIT_SRC=$src" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: irm | iex, escolher cliente e remover
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = if ('${{ matrix.shell }}' -eq 'pwsh') { 'pwsh' } else { 'powershell' }
          $tmp = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          New-Item -ItemType Directory -Path $tmp | Out-Null
          $env:USERPROFILE = $tmp
          $env:AI_KIT_REPO = $env:AI_KIT_SRC
          $script = Join-Path $env:GITHUB_WORKSPACE 'install.ps1'
          Set-Location $tmp
          # Lê os bytes como o irm faz (sem remover BOM), sem depender do cache do GitHub.
          & $exe -NoProfile -Command "[Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes('$script')) | iex"
          if ($LASTEXITCODE) { throw 'irm | iex falhou' }
          if (-not (Test-Path (Join-Path $tmp '.claude\skills\kit-sdd\SKILL.md'))) { throw 'claude sem skills' }
          if (-not (Test-Path (Join-Path $tmp '.agents\skills\kit-sdd\SKILL.md'))) { throw 'agents sem skills' }
          & $exe -NoProfile -Command "[Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes('$script')) | iex"
          if ($LASTEXITCODE) { throw 'atualizar falhou' }
          & $exe -NoProfile -Command "& ([scriptblock]::Create(([Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes('$script'))))) -Client agents"
          if ($LASTEXITCODE) { throw '-Client agents falhou' }
          & $exe -NoProfile -Command "& ([scriptblock]::Create(([Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes('$script'))))) -Client antigravity"
          if ($LASTEXITCODE) { throw '-Client antigravity falhou' }
          if (-not (Test-Path (Join-Path $tmp '.gemini\config\skills\kit-sdd\SKILL.md'))) { throw 'antigravity sem skills' }
          & $exe -NoProfile -Command "& ([scriptblock]::Create(([Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes('$script'))))) -Uninstall"
          if ($LASTEXITCODE) { throw '-Uninstall falhou' }
          if ((Get-ChildItem (Join-Path $tmp '.claude\skills')).Count -ne 0) { throw 'uninstall deixou links' }
          if ((Get-ChildItem (Join-Path $tmp '.gemini\config\skills')).Count -ne 0) { throw 'uninstall deixou antigravity' }
          if (-not (Test-Path (Join-Path $tmp '.ai-delivery-kit\skills\kit-sdd\SKILL.md'))) { throw 'uninstall apagou o clone' }
      - name: Comando real do README pela internet
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = if ('${{ matrix.shell }}' -eq 'pwsh') { 'pwsh' } else { 'powershell' }
          $tmp = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          New-Item -ItemType Directory -Path $tmp | Out-Null
          $env:USERPROFILE = $tmp
          Set-Location $tmp
          & $exe -NoProfile -Command "irm https://raw.githubusercontent.com/davinegreiiros/ai-delivery-kit/main/install.ps1 | iex"
          if ($LASTEXITCODE) { throw 'comando do README falhou' }
          if (-not (Test-Path (Join-Path $tmp '.claude\skills\kit-sdd\SKILL.md'))) { throw 'claude sem skills' }
